services:
  postgres:
    image: postgres:16-alpine
    container_name: musicapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: musicapp
      POSTGRES_USER: music
      POSTGRES_PASSWORD: music
    ports:
      - "5432:5432"
    volumes:
      - musicapp-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music -d musicapp"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  musicapp-data:
